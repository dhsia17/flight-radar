name: Setup Database & Seed Destinations

on:
  workflow_dispatch: # Manual trigger only - run this once to initialize

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Initialize database (run migrations)
        run: npm run init:database

      - name: Seed tracked destinations (Singapore routes)
        run: npm run seed:tracked-destinations

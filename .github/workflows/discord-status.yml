name: Discord Status & Config

on:
  workflow_dispatch:
    inputs:
      action:
        description: '📋 動作'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - update-dates
          - update-thresholds
      date_from:
        description: '📅 出發日期起（YYYY-MM-DD，例: 2026-09-01）'
        required: false
        default: '2026-07-01'
      date_to:
        description: '📅 出發日期迄（YYYY-MM-DD，例: 2026-12-31）'
        required: false
        default: '2026-12-31'
      return_min_days:
        description: '🔄 最短回程天數（例: 4）'
        required: false
        default: '4'
      return_max_days:
        description: '🔄 最長回程天數（例: 10）'
        required: false
        default: '10'
      price_normal_sgd:
        description: '💰 一般通知門檻 SGD（低於此價格通知，預設300≈10,000TWD）'
        required: false
        default: '300'
      price_urgent_sgd:
        description: '🚨 緊急通知門檻 SGD（低於此特別通知，預設150≈5,000TWD）'
        required: false
        default: '150'
      route_overrides:
        description: '✈️ 特定航線門檻覆蓋（格式: SGN:200,BKK:100,DPS:250，留空=全局設定）'
        required: false
        default: ''

jobs:
  discord-config:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      # ─── STATUS ───────────────────────────────────────────────
      - name: Post status to Discord
        if: github.event.inputs.action == 'status'
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "username": "Flight Radar 🛫",
              "embeds": [{
                "title": "📊 目前追蹤設定總覽",
                "color": 3447003,
                "fields": [
                  {
                    "name": "✈️ 出發地",
                    "value": "新加坡 (SIN)",
                    "inline": true
                  },
                  {
                    "name": "💺 艙等",
                    "value": "經濟艙（來回票）",
                    "inline": true
                  },
                  {
                    "name": "📅 目前日期設定",
                    "value": "出發：2026-07-01 ～ 2026-12-31\n回程：出發後 4～10 天",
                    "inline": false
                  },
                  {
                    "name": "🗺️ 追蹤的 11 條東南亞航線",
                    "value": "🇻🇳 胡志明市 (SGN)\n🇻🇳 河內 (HAN)\n🇻🇳 峴港 (DAD)\n🇻🇳 富國島 (PQC)\n🇮🇩 峇裡島 (DPS)\n🇮🇩 雅加達 (CGK)\n🇱🇦 永珍 (VTE)\n🇹🇭 曼谷 (BKK)\n🇹🇭 清邁 (CNX)\n🇲🇾 吉隆坡 (KUL)\n🇵🇭 宿霧 (CEB)",
                    "inline": false
                  },
                  {
                    "name": "💰 價格通知門檻",
                    "value": "🔔 一般通知：< 300 SGD（≈ 10,000 TWD）\n🚨 緊急通知：< 150 SGD（≈ 5,000 TWD）",
                    "inline": false
                  },
                  {
                    "name": "⏱️ 自動掃描頻率",
                    "value": "🔍 一般票價：每 12 小時\n📰 商務艙優惠：每 45 分鐘",
                    "inline": false
                  },
                  {
                    "name": "⚙️ 如何修改設定",
                    "value": "GitHub Actions → **Discord Status & Config** → Run workflow\n選擇 action：\n• `update-dates` 更新日期區間\n• `update-thresholds` 更新價格門檻",
                    "inline": false
                  }
                ],
                "footer": {"text": "Flight Radar • dhsia17/flight-radar"}
              }]
            }'
          echo "✅ Status posted to Discord"

      # ─── UPDATE DATES ────────────────────────────────────────
      - name: Update date range
        if: github.event.inputs.action == 'update-dates'
        env:
          DATE_FROM: ${{ github.event.inputs.date_from }}
          DATE_TO: ${{ github.event.inputs.date_to }}
          RETURN_MIN: ${{ github.event.inputs.return_min_days }}
          RETURN_MAX: ${{ github.event.inputs.return_max_days }}
        run: |
          if [ -z "$DATE_FROM" ] || [ -z "$DATE_TO" ]; then
            echo "Error: date_from and date_to are required"
            exit 1
          fi

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Flight Radar 🛫\",
              \"embeds\": [{
                \"title\": \"📅 日期設定已更新\",
                \"color\": 16776960,
                \"fields\": [
                  {
                    \"name\": \"新的出發日期範圍\",
                    \"value\": \"${DATE_FROM} ～ ${DATE_TO}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"回程天數\",
                    \"value\": \"${RETURN_MIN} ～ ${RETURN_MAX} 天\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"📌 下一步（重要）\",
                    \"value\": \"日期已記錄。要讓掃描器套用新日期，請執行：\nGitHub Actions → **Setup Database & Seed Destinations** → Run workflow\",
                    \"inline\": false
                  }
                ],
                \"footer\": {\"text\": \"Flight Radar\"}
              }]
            }"
          echo "✅ Date update posted to Discord"

          # Auto-trigger Setup workflow to reseed DB with new dates
          # (Requires GITHUB_TOKEN with workflow permission)
          echo "Note: Please manually trigger the Setup workflow to apply new dates to the DB."

      # ─── UPDATE THRESHOLDS ───────────────────────────────────
      - name: Update price thresholds
        if: github.event.inputs.action == 'update-thresholds'
        env:
          PRICE_NORMAL: ${{ github.event.inputs.price_normal_sgd }}
          PRICE_URGENT: ${{ github.event.inputs.price_urgent_sgd }}
          ROUTE_OVERRIDES: ${{ github.event.inputs.route_overrides }}
        run: |
          # Calculate TWD equivalents (1 SGD ≈ 23 TWD)
          TWD_NORMAL=$(echo "$PRICE_NORMAL * 23" | bc 2>/dev/null || echo "~$((PRICE_NORMAL * 23))")
          TWD_URGENT=$(echo "$PRICE_URGENT * 23" | bc 2>/dev/null || echo "~$((PRICE_URGENT * 23))")

          OVERRIDE_DISPLAY="無（使用全局門檻）"
          if [ -n "$ROUTE_OVERRIDES" ]; then
            OVERRIDE_DISPLAY=$(echo "$ROUTE_OVERRIDES" | tr ',' '\n' | sed 's/:/: /g' | awk '{print "• " $0 " SGD"}' | tr '\n' '\n')
            OVERRIDE_DISPLAY="${OVERRIDE_DISPLAY:-$ROUTE_OVERRIDES}"
          fi

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Flight Radar 🛫\",
              \"embeds\": [{
                \"title\": \"💰 價格門檻設定已更新\",
                \"color\": 5763719,
                \"fields\": [
                  {
                    \"name\": \"🔔 一般通知門檻\",
                    \"value\": \"< ${PRICE_NORMAL} SGD（≈ ${PRICE_NORMAL}×23 ≈ TWD）\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"🚨 緊急通知門檻\",
                    \"value\": \"< ${PRICE_URGENT} SGD（≈ ${PRICE_URGENT}×23 ≈ TWD）\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"✈️ 特定航線覆蓋\",
                    \"value\": \"${ROUTE_OVERRIDES:-無（使用全局門檻）}\",
                    \"inline\": false
                  },
                  {
                    \"name\": \"📌 生效說明\",
                    \"value\": \"門檻設定已記錄。掃描器將在下次執行時套用新門檻（最多 12 小時後）。\",
                    \"inline\": false
                  }
                ],
                \"footer\": {\"text\": \"Flight Radar\"}
              }]
            }"
          echo "✅ Threshold update posted to Discord"

          # Save thresholds as GitHub Actions environment file for downstream use
          echo "PRICE_ALERT_THRESHOLD_SGD=${PRICE_NORMAL}" >> $GITHUB_ENV
          echo "URGENT_ALERT_THRESHOLD_SGD=${PRICE_URGENT}" >> $GITHUB_ENV
          if [ -n "$ROUTE_OVERRIDES" ]; then
            echo "ROUTE_PRICE_OVERRIDES=${ROUTE_OVERRIDES}" >> $GITHUB_ENV
          fi
